<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#00d9ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Shield logo -->
  <g transform="translate(100, 180)">
    <rect width="80" height="80" rx="16" fill="url(#accent)" opacity="0.9"/>
    <path d="M40 8 L68 20 L68 42 Q68 62 40 74 Q12 62 12 42 L12 20 Z" fill="rgba(10,10,30,0.5)"/>
    <text x="40" y="52" text-anchor="middle" fill="white" font-size="28" font-weight="900" font-family="Arial, sans-serif">P</text>
  </g>
  <!-- Title -->
  <text x="210" y="230" fill="white" font-size="52" font-weight="800" font-family="Arial, sans-serif" letter-spacing="-1">Punjab Investigation</text>
  <text x="210" y="295" fill="url(#accent)" font-size="52" font-weight="800" font-family="Arial, sans-serif" letter-spacing="-1">Tools</text>
  <!-- Subtitle -->
  <text x="210" y="350" fill="rgba(160,174,192,1)" font-size="24" font-family="Arial, sans-serif">Professional Digital Forensics Platform</text>
  <!-- Tags -->
  <rect x="210" y="390" width="180" height="38" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="300" y="415" text-anchor="middle" fill="#10b981" font-size="16" font-weight="600" font-family="Arial, sans-serif">BSA 2023 Compliant</text>
  <rect x="405" y="390" width="180" height="38" rx="8" fill="rgba(0,217,255,0.1)" stroke="rgba(0,217,255,0.25)" stroke-width="1"/>
  <text x="495" y="415" text-anchor="middle" fill="#00d9ff" font-size="16" font-weight="600" font-family="Arial, sans-serif">25+ Tools</text>
  <rect x="600" y="390" width="200" height="38" rx="8" fill="rgba(233,69,96,0.12)" stroke="rgba(233,69,96,0.3)" stroke-width="1"/>
  <text x="700" y="415" text-anchor="middle" fill="#e94560" font-size="16" font-weight="600" font-family="Arial, sans-serif">100% Client-Side</text>
  <!-- URL -->
  <text x="210" y="490" fill="rgba(160,174,192,0.6)" font-size="20" font-family="Arial, sans-serif">punjab.pages.dev</text>
  <!-- Right side decorative icons area -->
  <rect x="900" y="120" width="200" height="390" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="1000" y="195" text-anchor="middle" fill="rgba(233,69,96,0.7)" font-size="32" font-family="Arial, sans-serif">🔒</text>
  <text x="1000" y="260" text-anchor="middle" fill="rgba(0,217,255,0.7)" font-size="32" font-family="Arial, sans-serif">🔍</text>
  <text x="1000" y="325" text-anchor="middle" fill="rgba(16,185,129,0.7)" font-size="32" font-family="Arial, sans-serif">📋</text>
  <text x="1000" y="390" text-anchor="middle" fill="rgba(251,191,36,0.7)" font-size="32" font-family="Arial, sans-serif">📱</text>
  <text x="1000" y="455" text-anchor="middle" fill="rgba(139,92,246,0.7)" font-size="32" font-family="Arial, sans-serif">🌐</text>
</svg>
